<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} — Slotly</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='/style.css') }}"
    >
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <header class="site-header">
          <a class="brand" href="/">Slotly</a>
          <nav class="navigation" aria-label="Основная навигация">
            <a class="navigation__link" href="/">Запись</a>
            <a class="navigation__link" href="/admin">Администрирование</a>
          </nav>
        </header>

        <h1 id="page-title">{{ page_title }}</h1>
        <div class="schedule-card">
          <div class="message message--error" role="alert">
            {{ message }}
          </div>
          <a class="back-link" href="{{ back_url }}">Вернуться к расписанию</a>
        </div>
      </section>
    </main>
  </body>
</html>
